<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Finite-sample diagnostic workflow</title>
  <desc id="desc">Prior samples become a Gaussian mixture under diffusion. Observation likelihoods reweight the samples to form an exact finite-sample reference. Approximate likelihood scores are compared with that reference.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#29465b"/>
    </marker>
    <style>
      .box{fill:#f7faf8;stroke:#29465b;stroke-width:2}.accent{fill:#e7f2ee;stroke:#126e63;stroke-width:2}.approx{fill:#fff4df;stroke:#9a5b13;stroke-width:2}.line{fill:none;stroke:#29465b;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}.h{font:700 18px system-ui,sans-serif;fill:#183042}.t{font:14px system-ui,sans-serif;fill:#29465b}.small{font:13px system-ui,sans-serif;fill:#29465b}.dot{fill:#126e63}
    </style>
  </defs>
  <rect width="960" height="360" rx="18" fill="#ffffff"/>
  <rect class="box" x="35" y="72" width="180" height="150" rx="14"/>
  <text class="h" x="125" y="105" text-anchor="middle">Finite prior samples</text>
  <circle class="dot" cx="77" cy="147" r="7"/><circle class="dot" cx="111" cy="172" r="7"/><circle class="dot" cx="146" cy="137" r="7"/><circle class="dot" cx="175" cy="180" r="7"/>
  <text class="small" x="125" y="207" text-anchor="middle">empirical measure πᴺ</text>
  <path class="line" d="M215 147H278"/>
  <rect class="box" x="280" y="72" width="190" height="150" rx="14"/>
  <text class="h" x="375" y="105" text-anchor="middle">Diffuse to time t</text>
  <ellipse cx="331" cy="157" rx="29" ry="21" fill="#d7ebe5"/><ellipse cx="375" cy="145" rx="30" ry="23" fill="#d7ebe5"/><ellipse cx="418" cy="171" rx="28" ry="21" fill="#d7ebe5"/>
  <circle class="dot" cx="331" cy="157" r="4"/><circle class="dot" cx="375" cy="145" r="4"/><circle class="dot" cx="418" cy="171" r="4"/>
  <text class="small" x="375" y="207" text-anchor="middle">Gaussian mixture pᴺ(xₜ)</text>
  <path class="line" d="M470 147H533"/>
  <rect class="accent" x="535" y="72" width="190" height="150" rx="14"/>
  <text class="h" x="630" y="105" text-anchor="middle">Reweight atoms</text>
  <text class="t" x="630" y="147" text-anchor="middle">w̃ᵢ ∝ wᵢ p(y | x⁽ⁱ⁾)</text>
  <text class="small" x="630" y="181" text-anchor="middle">observation enters exactly</text>
  <path class="line" d="M725 147H788"/>
  <rect class="accent" x="790" y="72" width="140" height="150" rx="14"/>
  <text class="h" x="860" y="105" text-anchor="middle">Reference</text>
  <text class="t" x="860" y="145" text-anchor="middle">finite-sample</text>
  <text class="t" x="860" y="166" text-anchor="middle">posterior score</text>
  <text class="small" x="860" y="207" text-anchor="middle">exact for πᴺ</text>
  <rect class="approx" x="280" y="270" width="445" height="60" rx="14"/>
  <text class="h" x="502" y="296" text-anchor="middle">Moment-based likelihood-score approximations</text>
  <text class="small" x="502" y="318" text-anchor="middle">DPS · ΠGDM · TMPD</text>
  <path class="line dash" d="M725 300C815 300 860 270 860 225"/>
  <text class="small" x="828" y="292" text-anchor="middle">diagnose against</text>
</svg>
